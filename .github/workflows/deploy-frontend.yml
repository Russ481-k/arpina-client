name: Deploy Frontend to Remote Server

on:
  push:
    branches: ["dev"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Validate API URL format
        env:
          API_URL_CHECK: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          if [[ "$API_URL_CHECK" == http* ]]; then
            echo "NEXT_PUBLIC_API_URL starts with http. Format is valid."
          else
            echo "::error::NEXT_PUBLIC_API_URL is missing the protocol (http:// or https://)."
            exit 1
          fi

      - name: Install dependencies and build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            cd ./client && git pull origin dev && cd ..
            docker compose build --no-cache client
            docker compose up -d --force-recreate --remove-orphans client
